name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check src/ scripts/

      - name: ruff check
        working-directory: backend
        run: uv run ruff check src/ scripts/

      - name: mypy
        working-directory: backend
        run: uv run mypy src/

      # testcontainers needs a Docker daemon for the integration/e2e suites (real Postgres) --
      # GitHub-hosted ubuntu runners provide one out of the box, no extra setup required.
      - name: pytest (unit + integration + e2e)
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Format check
        working-directory: web
        run: npm run format:check

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: web
        run: npm run test:e2e

      - name: Build
        working-directory: web
        run: npm run build
