[project]
name = "workout-storage"
version = "0.1.0"
description = "MCP server + Postgres storage for personal workout tracking"
# No `readme`: hatchling refuses a path outside the project directory, which broke every CI run
# from 2026-08-14 ("Readme path must be within the project directory: ../README.md"). This package
# is only ever installed editable for tests, never published, so the field was decoration.
requires-python = ">=3.12"
dependencies = [
    # 3.4.3 enables Host validation (DNS-rebinding protection) that 421s every request behind
    # Vercel's proxy -- see requirements.txt's matching pin. Bump the upper bound deliberately,
    # together with requirements.txt, after testing against prod domains.
    "fastmcp>=2.9,<3.4.3",
    "psycopg[binary,pool]>=3.2",
    "openpyxl>=3.1",
    "posthog>=6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workout_storage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that need a real Postgres (Docker / testcontainers)",
    "e2e: end-to-end tests driving the MCP server in-memory",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Multi-language HTML email templates: long lines are copy, not logic. Wrapping them would
# fragment the copy across lines without improving readability, and this file is edited for
# content, not structure.
"src/workout_storage/email.py" = ["E501"]

[tool.ruff.format]
# Defaults (double quotes, 4-space indent) — explicit so the choice is documented, not implicit.

[tool.mypy]
python_version = "3.12"
strict = true
# scripts/ are one-off ops tools, not library code — skip the strict bar there.
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
